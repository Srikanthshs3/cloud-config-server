eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

security:
  # Entry syntax: "[METHOD ]ant-pattern". A valid token is still honoured on these paths.
  public-paths:
    - /api/v1/auth/**
    - GET /api/v1/product/**            # CHANGED: reads only (writes need a token)
    - GET /api/v1/category/**           # CHANGED: reads only
    - POST /api/v1/sellers/register     # NEW: seller sign-up
    - GET /api/v1/sellers/*/public      # NEW: public store page
    - POST /api/v1/delivery-agents/register
    - GET /api/v1/review/**             # NEW: anyone can read reviews and pictures
    - POST /api/v1/payment/webhooks/**   # NEW: Razorpay/Stripe call this; the signature is the authentication
    - /fallback
    - /actuator/health/**               # CHANGED: was /actuator/** (exposed the gateway's route list)
    - /actuator/prometheus

secreteJwtString: ${JWT_SECRET:adfnkgndsfvndnscsodvndvndkvnknvkdfsnkjdsnvdfnnd}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authCb:
        baseConfig: default
      userCb:
        baseConfig: default
      notificationCb:
        baseConfig: default
      productImagesCb:
        baseConfig: default
      productCb:
        baseConfig: default
      categoryCb:
        baseConfig: default
      cartCb:
        baseConfig: default
      inventoryCb:
        baseConfig: default
      orderCb:
        baseConfig: default
      paymentWebhookCb:
        baseConfig: default
      paymentCb:
        baseConfig: default
      shippingCb:
        baseConfig: default
      couponCb:
        baseConfig: default
      reviewCb:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true
    instances:
      authCb:
        timeoutDuration: 8s
      userCb:
        timeoutDuration: 8s
      notificationCb:
        timeoutDuration: 8s
      productImagesCb:
        timeoutDuration: 30s
      productCb:
        timeoutDuration: 8s
      categoryCb:
        timeoutDuration: 8s
      cartCb:
        timeoutDuration: 8s
      inventoryCb:
        timeoutDuration: 8s
      orderCb:
        timeoutDuration: 15s
      paymentWebhookCb:
        timeoutDuration: 15s
      paymentCb:
        timeoutDuration: 20s
      shippingCb:
        timeoutDuration: 8s
      couponCb:
        timeoutDuration: 8s
      reviewCb:
        timeoutDuration: 8s

# Set to true ONLY when clients reach the gateway through a trusted reverse proxy / load balancer
gateway:
  rate-limit:
    trust-forwarded-for: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,circuitbreakers
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true