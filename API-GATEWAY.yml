                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # Razorpay/Stripe call this: NO rate limit (their bursts are legitimate; the signature is the authentication) and no retry.
        - id: payment-webhook-route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payment/webhooks/**
          metadata:
            connect-timeout: 2000
