# =====================================================================================================================
#  API gateway: routing + EDGE resilience (Stage 9)
#
#   Rate limiter    RequestRateLimiter (Redis token bucket) per route, per user (or per IP when anonymous). 429 when empty.
#                   Redis down => requests are let through (fail-open), the gateway never becomes the outage.
#   Circuit breaker one breaker PER ROUTE (before: one shared breaker, so a failing payment-service also cut off products).
#   Time limiter    per route (timelimiter.instances below) - the breaker's call is cancelled and answered by /fallback (504).
#   Retry           ONE retry, GET only, only on connection errors / 502 / 503 / 504. Never for POST/PUT/DELETE.
#   Bulkhead        gateway.httpclient.pool: at most 500 connections to services, waiting max 2 s for one.
#
#  Tune a limit: replenishRate = requests per second that refill, burstCapacity = how many can arrive at once.
# =====================================================================================================================
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms            # rate limiting must never slow requests down
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 2000
        response-timeout: 30s   # ceiling only; every route sets its own via metadata.response-timeout
        pool:
          type: FIXED
          max-connections: 500
          acquire-timeout: 2000
      routes:
        # Login, OTP, registration, password reset: strict per-IP limit (brute force / OTP abuse). Only GET (/auth/me) is retried.
        - id: auth-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          metadata:
            connect-timeout: 2000
            response-timeout: 10000
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@routeUserOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: authCb
                fallbackUri: forward:/fallback
                statusCodes: 502,503,504
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                exceptions: java.io.IOException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/user/**,/api/v1/address/**,/api/v1/sellers/**,/api/v1/delivery-agents/**
          metadata:
            connect-timeout: 2000
            response-timeout: 10000
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@routeUserOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: userCb
                fallbackUri: forward:/fallback
                statusCodes: 502,503,504
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                exceptions: java.io.IOException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        - id: notification-service-route
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notification/**
          metadata:
            connect-timeout: 2000
            response-timeout: 10000
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@routeUserOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: notificationCb
                fallbackUri: forward:/fallback
                statusCodes: 502,503,504
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                exceptions: java.io.IOException
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # Picture upload/serve: longer time limit than the rest of the catalogue (up to 8 pictures of 5 MB).
        - id: product-images-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/product/*/images/**,/api/v1/product/images/**
          metadata:
            connect-timeout: 2000
            response-timeout: 32000
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@routeUserOrIpKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: productImagesCb
                fallbackUri: forward:/fallback
