                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        - id: product-service-route
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/product/**
          metadata:
            connect-timeout: 2000
            response-timeout: 10000
          filters:
