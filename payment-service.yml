spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_PAYMENT_DB:payment_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Admin@123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

# 0.0 = always succeed. Set e.g. 0.3 to simulate a 30% decline rate and exercise
# inventory-service's compensating release path.
payment:
  simulate:
    failure-rate: ${PAYMENT_SIMULATE_FAILURE_RATE:0.0}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [payment-service,%X{traceId:-},%X{spanId:-}]"