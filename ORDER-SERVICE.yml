spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:order_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Admin@123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 'update' for local/dev only - use Flyway/Liquibase migrations before production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service-group
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  # ---- Stage 9: resilience of the Feign clients (cart-service, coupon-service) ----
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true                 # every Feign method gets a circuit breaker + the fallbackFactory
        alphanumeric-ids:
          enabled: true               # breaker names: CartApiClientgetUserCart, CouponApiClientredeem ...
      client:
        config:
          default:
            connectTimeout: 2000      # ms
            readTimeout: 8000         # ms (placing an order is a user-facing action; do not wait longer)
            loggerLevel: basic

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    #ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # Default to localhost for IDE, override via ENV var in Docker Compose
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Loki URL needs to point to the Loki container
loki:
  # Default to localhost for IDE, override via ENV var in Docker Compose
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR
  pattern:
    level: "%5p [order-service,%X{traceId:-},%X{spanId:-}]"

# ---- Stage 9: circuit breaker / time limiter for the Feign clients ------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Feign 4xx = the other service answered "your request is wrong": not a sick dependency.
        # (A list in a service file REPLACES the shared default list, so the shared entries are repeated here.)
        ignoreExceptions:
          - org.praskanth.exception.NotFoundException
          - org.praskanth.exception.BadRequestException
          - org.praskanth.exception.ConflictException
          - org.praskanth.exception.ForbiddenOperationException
          - org.praskanth.exception.UnauthorizedException
          - org.praskanth.exception.TooManyRequestsException
          - org.springframework.web.client.HttpClientErrorException
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$UnprocessableEntity
          - feign.FeignException$TooManyRequests
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s          # a little above readTimeout, so Feign's own timeout fires first and gives a clean error
        cancelRunningFuture: true
