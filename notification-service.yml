spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-group
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: srikanthp0720@gmail.com
    password: gmsolgtsaponztmc
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # Default to localhost for IDE, override via ENV var in Docker Compose
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
# Loki URL needs to point to the Loki container
loki:
    # Default to localhost for IDE, override via ENV var in Docker Compose
    url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

logging:
  pattern:
    level: "%5p [notification-service,%X{traceId:-},%X{spanId:-}]"
  level:
    org.apache.kafka.clients.NetworkClient: ERROR
