spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/shipping_db
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:Admin@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: shipping-service-group
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # Default to localhost for IDE, override via ENV var in Docker Compose
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Loki URL needs to point to the Loki container
loki:
  # Default to localhost for IDE, override via ENV var in Docker Compose
  url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR
  pattern:
    level: "%5p [shipping-service,%X{traceId:-},%X{spanId:-}]"
